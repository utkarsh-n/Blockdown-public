name: Blockdown
options:
  bundleIdPrefix: com.utkarsh
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "5"
    CODE_SIGN_STYLE: Automatic
targets:
  Blockdown:
    type: application
    platform: iOS
    sources:
      - Blockdown
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.utkarsh.blockdown
        INFOPLIST_FILE: Blockdown/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Blockdown
    dependencies:
      - target: BlockdownWidget
  BlockdownWidget:
    type: app-extension
    platform: iOS
    sources:
      - BlockdownWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.utkarsh.blockdown.widget
        INFOPLIST_FILE: BlockdownWidget/Info.plist
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "1"
